<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Favicon for modern browsers: points to SVG in the `public/` folder. -->
  <!-- Browsers use this for the tab icon, bookmarks and some UI. -->
  <link rel="icon" href="src/assets/images/favicon.png" type="image/png+xml">

  <!-- Legacy/fallback favicon (historical): kept for compatibility with older browsers/clients. -->
  <!-- You can also add PNG/ICO variants for broader support if needed. -->
  <link rel="shortcut icon" href="/favicon.png">
</head>

  <!-- SPA redirect handling for GitHub Pages -->
  <script>
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
